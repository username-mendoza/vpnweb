<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56">
  <defs>
    <linearGradient id="sg" x1="28" y1="4" x2="28" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ea8ff"/>
      <stop offset="100%" stop-color="#3a58ef"/>
    </linearGradient>
  </defs>

  <!-- Circle icon (56x56 canvas, centered at x=28 y=28) -->
  <circle cx="28" cy="28" r="24" fill="url(#sg)"/>
  <!-- Lock shackle -->
  <path d="M20.5 27.5V23A7.5 7.5 0 0 1 35.5 23V27.5" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lock body -->
  <rect x="19" y="27.5" width="18" height="13" rx="3" fill="white"/>
  <!-- Keyhole -->
  <circle cx="28" cy="33" r="2.5" fill="url(#sg)"/>
  <rect x="26.7" y="35" width="2.6" height="3" rx="1.3" fill="url(#sg)"/>

  <!-- Wordmark -->
  <!-- "SoftEther" -->
  <text x="56" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.3">SoftEther</text>
  <!-- "VPN Manager" -->
  <text x="57" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5b7fff" letter-spacing="0.5">VPN Manager</text>
</svg>
